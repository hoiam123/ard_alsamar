<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>تواصل معنا - أرض السمر</title>

</head>

<body>

    <main>

        <section>

            <h1> أرض السمر</h1>

            <h2> تواصل معنا</h2>

            <p>
                يسعدنا تواصلك معنا وإرسال آرائك
                واقتراحاتك حول موقع أرض السمر.
            </p>

        </section>

        <!-- نموذج التواصل -->

        <section>

            <h2>📝 أرسل لنا رسالتك</h2>

            <form id="contactForm">>

                <label>الاسم:</label>
                <br>

                <input type="text" id="name" placeholder="اكتب اسمك" required>

                <br><br>

                <label>البريد الإلكتروني:</label>
                <br>

                <input type="email" id="email" placeholder="اكتب بريدك الإلكتروني" required>

                <br><br>

                <label>الرسالة:</label>
                <br>

                <textarea id="message" rows="6" placeholder="اكتب رسالتك هنا" required></textarea>

                <br><br>

                <button type="submit">
                     إرسال الرسالة
                </button>

            </form >

        </section>

        <!-- زر العودة -->

        <section>

            <a href="index.html">
                <button type="button">
                    ⬅️ العودة إلى الصفحة الرئيسية
                </button>
            </a>

        </section>

    </main>

</body>
<script src="script.js"></script>
</html>
